<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- torann: the unit cell of the torus. The blue query's nearest
       neighbour (teal) is reached across the seam — the dashed link
       leaves the right edge and re-enters on the left. -->
  <!-- unit cell -->
  <rect x="14" y="14" width="100" height="100" rx="16"
        fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>

  <!-- offset integer grid (B = 3, offset u: lines off the thirds) -->
  <g stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="3.5 4.5">
    <line x1="46" y1="17" x2="46" y2="111"/>
    <line x1="83" y1="17" x2="83" y2="111"/>
    <line x1="17" y1="41" x2="111" y2="41"/>
    <line x1="17" y1="86" x2="111" y2="86"/>
  </g>

  <!-- neighbour link across the seam: leaves right, re-enters left -->
  <g stroke="#14b8a6" stroke-width="3.4" stroke-dasharray="5 5"
     stroke-linecap="round" fill="none">
    <line x1="96" y1="64" x2="119" y2="64"/>
    <line x1="9"  y1="64" x2="33" y2="64"/>
  </g>

  <!-- background points -->
  <g fill="#94a3b8">
    <circle cx="56" cy="30" r="4.5"/>
    <circle cx="33" cy="52" r="4.5"/>
    <circle cx="70" cy="99" r="4.5"/>
    <circle cx="97" cy="28" r="4.5"/>
    <circle cx="38" cy="103" r="4.5"/>
  </g>
  <circle cx="63" cy="70" r="5" fill="#8b5cf6"/>

  <!-- the pair: query (blue) and its wrapped nearest neighbour (teal) -->
  <circle cx="96" cy="64" r="7.5" fill="#3b82f6" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="33" cy="64" r="7.5" fill="#14b8a6" stroke="#ffffff" stroke-width="2.5"/>
</svg>
