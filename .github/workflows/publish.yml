name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

# The wheels are built with maturin (mixed Rust/Python package).
#
# x86-64 wheels are built with an **AVX2 + FMA floor**, which the committed
# .cargo/config.toml already applies, so these jobs leave it alone. That
# floor is worth 17% and is not optional in practice: the distance kernel is
# a scalar loop the compiler auto-vectorizes, and without AVX there is no
# 256-bit register for it to lower to — the query goes 340 ms -> 408 ms on
# the reference shape. AVX-512 is a further 4% at d=32 but nearly 2x *worse*
# at d=8, so there is no third variant to build.
#
# These jobs previously did `rm -f .cargo/config.toml` to strip a
# `target-cpu=native` setting. That removed the crash risk *and* the floor:
# every wheel published that way ran the SSE fallback. Portability is now
# handled where it belongs, at import — `torann/rust.py` checks for AVX2 and
# falls back to the pure-Python backend rather than taking SIGILL.
#
# aarch64 needs no flags: NEON is baseline on arm64 and the config section is
# gated on x86, so it does not apply there.
#
# `rust-toolchain: stable` is pinned on every build job on purpose. The
# distance kernel uses the algebraic float methods stabilized in Rust 1.98
# (`Cargo.toml` declares the `rust-version`), and the manylinux container
# ships whatever toolchain its image was built with — without this the
# wheel build can fail on `algebraic_add` with no obvious cause.
#
# The interpreter list matches `requires-python = ">=3.12"`. Building 3.10
# and 3.11 wheels produced artifacts pip would refuse to install.

jobs:
  wheels-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter 3.12 3.13 3.14
          manylinux: auto
          rust-toolchain: stable
      # The bug this replaced was a wheel that silently lost its AVX2 floor,
      # so assert the floor is in the artifact rather than trusting the
      # config to have been picked up through maturin's container. Every
      # wheel is checked, not just one: `dist/*.whl` is one wheel per
      # interpreter, and they are separate builds.
      - name: Verify the x86-64 wheels carry the AVX2 floor
        if: matrix.target == 'x86_64'
        run: |
          set -euo pipefail
          for whl in dist/*.whl; do
            rm -rf /tmp/whl && mkdir -p /tmp/whl
            python -m zipfile -e "$whl" /tmp/whl
            find /tmp/whl -name '_native*.so' | while read -r so; do
              n=$(objdump -d "$so" | grep -c '%ymm' || true)
              echo "$(basename "$whl"): $n 256-bit instructions"
              if [ "$n" -eq 0 ]; then
                echo "::error::$(basename "$whl") has no AVX2 code"
                exit 1
              fi
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  wheels-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter 3.12 3.13 3.14
          rust-toolchain: stable
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  wheels-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --interpreter 3.12 3.13 3.14
          rust-toolchain: stable
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          rust-toolchain: stable
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    needs: [wheels-linux, wheels-macos, wheels-windows, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
