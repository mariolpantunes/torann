name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned, and matching requirements.txt. Unpinned, a linter
          # release that enables new rules by default fails a PR that changed
          # none of the code it flags -- which is what happened at ruff 0.16.
          pip install ruff==0.16.1 basedpyright==1.39.8 vulture==2.16
          pip install .

      - name: Lint with Ruff
        run: ruff check torann

      - name: Type-check with basedpyright
        run: basedpyright

      - name: Dead code with Vulture
        run: vulture

      - name: Run tests
        run: python -m unittest discover -s test

  # The Rust core gets the same treatment: rustfmt + clippy as errors.
  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release -- -D warnings

  # The package must keep working without the compiled module: this job
  # runs the same suite against the pure-Python reference implementation.
  # It is also what backs the AVX2 gate in `torann/rust.py` — a CPU without
  # AVX2 lands on exactly this path, so it has to stay green.
  test-pure-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run tests (python backend only)
        run: python -m unittest discover -s test
