name: CI

# The gate. `.pre-commit-config.yaml` runs the same steps at commit time; if
# one changes, the other changes in the same commit. Tool versions come from
# pyproject.toml's dependency groups (`lint`, `test`, `build`) and the Rust
# toolchain is pinned to the one the hooks run with locally (1.99.1). Runner
# images are pinned too (not `*-latest`), so a label migration never changes
# the gate silently; bump them with the actions when a newer image ships.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        # The floor and the newest supported release; one abi3 wheel serves both.
        python-version: ["3.12", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      # Same as the `venv-matches-ci` hook: build the extension in place, so
      # the tests (which import the working tree) exercise the Rust. This job
      # used to `pip install .` into site-packages and then test the source
      # tree, which has no `.so`: every native test skipped and the job passed.
      - name: Build the extension in place
        run: |
          python -m venv venv
          venv/bin/pip install -q --upgrade pip
          venv/bin/pip install -q --group build --group lint
          VIRTUAL_ENV=$PWD/venv venv/bin/maturin develop --release --group test

      - name: Lint with Ruff
        run: venv/bin/ruff check torann test examples exploration

      - name: Format check with Ruff
        run: venv/bin/ruff format --check torann test examples exploration

      - name: Type-check with basedpyright
        run: venv/bin/basedpyright

      - name: Dead code with Vulture
        run: venv/bin/vulture

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
          TORANN_REQUIRE_NATIVE: "1"
        run: |
          venv/bin/python -m coverage run -m unittest discover -s test
          venv/bin/python -m coverage report -m --fail-under=93

  # The Rust core gets the same treatment: rustfmt, clippy as errors in both
  # the release and the instrumented (`--features stats`) build, cargo test.
  lint-rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Rust
        # The branch name is the toolchain: keep it equal to publish.yml and docs.yml.
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (release)
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Clippy (release, --features stats)
        run: cargo clippy --release --all-targets --features stats -- -D warnings

      - name: Test
        run: cargo test

  # The package must keep working without the compiled module: this job
  # runs the same suite against the pure-Python reference implementation.
  # It is also what backs the AVX2 gate in `torann/rust.py` — a CPU without
  # AVX2 lands on exactly this path, so it has to stay green.
  test-pure-python:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the runtime dependencies only
        run: |
          python -m venv venv
          venv/bin/pip install -q --upgrade pip
          deps=$(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))")
          venv/bin/pip install -q $deps

      - name: Run tests (python backend only)
        env:
          PYTHONPATH: .
          TORANN_REQUIRE_NATIVE: "0"
        run: venv/bin/python -m unittest discover -s test
