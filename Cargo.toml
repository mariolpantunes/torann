[package]
name = "torann"
version = "0.4.0"
edition = "2021"
# The distance kernel uses the algebraic float methods stabilized in 1.98.
rust-version = "1.98"
description = "Rust core of torann — toroidal L1 LSH index"

[lib]
name = "torann"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
rayon = "1.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
