[package]
name = "torann"
version = "0.5.2"
edition = "2021"
# The distance kernel uses the algebraic float methods stabilized in 1.98.
rust-version = "1.98"
description = "Rust core of torann — toroidal L1 LSH index"

[lib]
name = "torann"
crate-type = ["cdylib"]

[features]
# Query instrumentation (`RustLshIndex.stats()`). Debug builds always carry
# it; release builds only with `maturin build --release --features stats`,
# so a published wheel has no counters and exposes none of them.
stats = []

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
numpy = "0.29"
rayon = "1.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
