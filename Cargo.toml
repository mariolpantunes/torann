[package]
name = "torann"
version = "0.2.1"
edition = "2021"
description = "Rust core of torann — toroidal L1 LSH index"

[lib]
name = "torann"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
rayon = "1.12"
wide = "1.5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
