[project]
name = "torann"
version = "0.2.0"
description = "torann — TORoidal Approximate Nearest Neighbours: L1 LSH on the unit torus"
authors = [
    {name = "Mário Antunes", email = "mario.antunes@av.it.pt"}
]
readme = "README.md"
dependencies = ["numpy"]
requires-python = ">=3.10"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Mixed Rust/Python project: the `torann/` package plus a compiled
# extension exposed as `torann._native`. `maturin build --release`
# produces the complete wheel.
module-name = "torann._native"
features = ["pyo3/extension-module"]
