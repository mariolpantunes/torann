# The CI gate, moved to commit time.
#
# Every Python hook below is `language: system`, not a pinned mirror. A mirror
# would fetch its own copy of ruff or basedpyright and run it against a config
# that pre-commit chose, which is how a repository ends up with hooks that pass
# and CI that fails. These call the tools already installed in the environment
# and let them read `pyproject.toml`, so `git commit` and `.github/workflows`
# are running the same check with the same settings by construction.
#
# `pass_filenames: false` on the whole-project tools is deliberate. basedpyright
# and vulture both need to see every file to be correct -- vulture calls a
# function dead when nothing references it, and handing it only the staged files
# means everything they reference looks unreferenced. Type-checking one file in
# isolation fails the same way.
#
# The Rust hooks trigger on Cargo.toml as well as *.rs, for the same reason
# the Python ones trigger on pyproject.toml: a dependency or lint change in
# the manifest can break the build or surface new clippy warnings without any
# .rs file being touched.
#
# The two Rust hooks mirror the `lint-rust` job. They match on `files` rather
# than `types: [rust]` plus a manual stage, because cargo has to see the whole
# crate either way -- the trigger is "something cargo builds from changed", the
# check is always crate-wide. clippy runs `--release` to match CI: the debug and release
# profiles do not enable the same lints, and a warning that only appears in one
# of them is exactly the kind that reaches main.
#
# Note the ruff target is `torann`, not `src`: in this repository `src/` is the
# Rust crate and the Python package sits at `torann/`. The other two repos lint
# `src` for the same reason -- it is where their Python lives.
#
# `files` rather than `types: [python]` on the project-wide hooks: they are
# driven by pyproject.toml (ruff rules, basedpyright mode, vulture paths, any
# coverage threshold), so a commit that changes only that file must still run
# them. Filtering on file *type* skipped them all at exactly the moment the
# configuration governing them was being edited.
#
# Install with: pre-commit install
# Run over everything once: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: ruff
        name: ruff (torann)
        entry: ruff check torann
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: basedpyright
        name: basedpyright
        entry: basedpyright
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: vulture
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: unittest
        name: unittest
        entry: python -m unittest discover -s test
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        files: '(\.rs$|^Cargo\.toml$)'
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (release, warnings are errors)
        entry: cargo clippy --release -- -D warnings
        language: system
        files: '(\.rs$|^Cargo\.toml$)'
        pass_filenames: false
