[package]
name = "ann-backend-rust"
version = "0.1.0"
edition = "2021"
description = "Rust backend for the ann toroidal L1 LSH index"

[lib]
name = "ann_backend_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
rayon = "1.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
