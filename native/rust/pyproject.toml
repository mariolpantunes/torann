[project]
name = "ann-backend-rust"
version = "0.1.0"
description = "Rust backend for the ann toroidal L1 LSH index"
authors = [
    {name = "Mário Antunes", email = "mario.antunes@av.it.pt"}
]
dependencies = ["numpy"]
requires-python = ">=3.10"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "ann_backend_rust"
